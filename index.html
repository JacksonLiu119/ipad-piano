<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>家用小鋼琴</title>
  <style>
    :root {
      --bg1: #fff7e8;
      --bg2: #dff3ff;
      --panel: #ffffffcc;
      --ink: #2a2a2a;
      --accent: #ff8f5a;
      --good: #5dbb63;
      --white-key: #fffdf8;
      --white-key-border: #d6d2c8;
      --white-key-active: #ffd7b8;
      --black-key: #313131;
      --black-key-active: #ffb277;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; font-family: "Avenir Next", "PingFang TC", "Noto Sans TC", sans-serif; color: var(--ink); overflow: hidden; touch-action: none; }
    body {
      background: radial-gradient(circle at 20% 10%, var(--bg2), transparent 35%),
                  radial-gradient(circle at 80% 90%, #ffe4cc, transparent 30%),
                  linear-gradient(140deg, var(--bg1), #f1fff4);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    }
    .topbar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      background: var(--panel); border: 1px solid #ffffff; border-radius: 12px; padding: 8px;
      backdrop-filter: blur(4px);
    }
    .title { font-weight: 700; margin-right: auto; padding: 0 6px; }
    button {
      border: 0; border-radius: 10px; padding: 10px 12px; font-size: 15px; font-weight: 600;
      background: #f5f5f5; color: var(--ink);
    }
    button.active { background: var(--accent); color: white; }
    button.guide-on { background: var(--good); color: white; }
    .piano-wrap {
      background: #ffffffaa; border-radius: 12px; border: 1px solid #fff; padding: 10px; overflow: hidden;
    }
    .piano {
      position: relative; height: calc(100vh - 130px); min-height: 280px; max-height: 520px;
      display: grid; grid-template-columns: repeat(14, 1fr); gap: 2px;
    }
    .white {
      position: relative; background: var(--white-key); border: 1px solid var(--white-key-border);
      border-radius: 0 0 8px 8px; box-shadow: inset 0 -4px 0 #ece8df;
    }
    .white.active, .white.guide { background: var(--white-key-active); }
    .white .label {
      position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 11px; opacity: 0.55;
    }
    .black {
      position: absolute; width: calc((100% / 14) * 0.7); height: 58%;
      background: var(--black-key); border-radius: 0 0 6px 6px; z-index: 5;
      box-shadow: inset 0 -2px 0 #161616;
    }
    .black.active, .black.guide { background: var(--black-key-active); }
    .hint { font-size: 12px; opacity: 0.7; padding: 0 6px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title">家用小鋼琴</div>
    <button id="tonePiano" class="active">鋼琴音</button>
    <button id="toneBell">鈴鐺音</button>
    <button id="guideBtn">跟彈：小星星</button>
    <div class="hint">可同時按多個鍵</div>
  </div>
  <div class="piano-wrap">
    <div class="piano" id="piano"></div>
  </div>

  <script>
    const noteNames = ["C", "D", "E", "F", "G", "A", "B"];
    const whiteLayout = [];
    for (let o = 4; o <= 5; o++) {
      for (const n of noteNames) whiteLayout.push(`${n}${o}`);
    }
    const blackMap = { C: "C#", D: "D#", F: "F#", G: "G#", A: "A#" };
    const semitone = { C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11 };

    const audio = new (window.AudioContext || window.webkitAudioContext)();
    let tone = "piano";
    const activeByPointer = new Map();

    function noteToFreq(note) {
      const m = note.match(/^([A-G]#?)(\d)$/);
      const midi = 12 * (Number(m[2]) + 1) + semitone[m[1]];
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function play(note) {
      const t0 = audio.currentTime;
      const f = noteToFreq(note);
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = f;
      if (tone === "piano") {
        osc.type = "triangle";
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.32, t0 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.1);
      } else {
        osc.type = "sine";
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.8);
      }
      osc.connect(gain).connect(audio.destination);
      osc.start(t0);
      osc.stop(t0 + 2);
    }

    const piano = document.getElementById("piano");
    const keyEls = new Map();

    function makeWhite() {
      whiteLayout.forEach((note) => {
        const k = document.createElement("div");
        k.className = "white";
        k.dataset.note = note;
        const l = document.createElement("div");
        l.className = "label";
        l.textContent = note;
        k.appendChild(l);
        piano.appendChild(k);
        keyEls.set(note, k);
      });
    }

    function makeBlack() {
      const blacks = [];
      whiteLayout.forEach((note, i) => {
        const n = note.slice(0, -1);
        const o = note.slice(-1);
        if (blackMap[n]) blacks.push({ note: `${blackMap[n]}${o}`, leftIndex: i });
      });
      blacks.forEach((b) => {
        const k = document.createElement("div");
        k.className = "black";
        k.dataset.note = b.note;
        k.style.left = `calc((100% / 14) * ${b.leftIndex + 0.65})`;
        piano.appendChild(k);
        keyEls.set(b.note, k);
      });
    }

    function hitTarget(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      return el.closest(".white, .black");
    }

    function setActive(el, on) {
      if (!el) return;
      el.classList.toggle("active", on);
    }

    function press(pointerId, el) {
      if (!el) return;
      const prev = activeByPointer.get(pointerId);
      if (prev === el) return;
      if (prev) setActive(prev, false);
      activeByPointer.set(pointerId, el);
      setActive(el, true);
      play(el.dataset.note);
      checkGuide(el.dataset.note);
    }

    function release(pointerId) {
      const prev = activeByPointer.get(pointerId);
      if (prev) setActive(prev, false);
      activeByPointer.delete(pointerId);
    }

    piano.addEventListener("pointerdown", async (e) => {
      if (audio.state !== "running") await audio.resume();
      press(e.pointerId, hitTarget(e.clientX, e.clientY));
    });
    window.addEventListener("pointermove", (e) => {
      if (!activeByPointer.has(e.pointerId)) return;
      press(e.pointerId, hitTarget(e.clientX, e.clientY));
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach((evt) => {
      window.addEventListener(evt, (e) => release(e.pointerId));
    });

    const tonePiano = document.getElementById("tonePiano");
    const toneBell = document.getElementById("toneBell");
    tonePiano.onclick = () => {
      tone = "piano";
      tonePiano.classList.add("active");
      toneBell.classList.remove("active");
    };
    toneBell.onclick = () => {
      tone = "bell";
      toneBell.classList.add("active");
      tonePiano.classList.remove("active");
    };

    const twinkle = ["C4","C4","G4","G4","A4","A4","G4","F4","F4","E4","E4","D4","D4","C4"];
    let guideOn = false;
    let guideIndex = 0;
    const guideBtn = document.getElementById("guideBtn");

    function refreshGuide() {
      keyEls.forEach((el) => el.classList.remove("guide"));
      if (!guideOn) return;
      keyEls.get(twinkle[guideIndex])?.classList.add("guide");
      guideBtn.classList.add("guide-on");
      guideBtn.textContent = `跟彈中：第 ${guideIndex + 1} 音`;
    }

    function checkGuide(note) {
      if (!guideOn) return;
      if (note === twinkle[guideIndex]) {
        guideIndex = (guideIndex + 1) % twinkle.length;
        refreshGuide();
      }
    }

    guideBtn.onclick = () => {
      guideOn = !guideOn;
      guideIndex = 0;
      if (!guideOn) {
        keyEls.forEach((el) => el.classList.remove("guide"));
        guideBtn.classList.remove("guide-on");
        guideBtn.textContent = "跟彈：小星星";
        return;
      }
      refreshGuide();
    };

    makeWhite();
    makeBlack();
  </script>
</body>
</html>
