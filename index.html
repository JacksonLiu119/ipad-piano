<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>家用小鋼琴</title>
  <style>
    :root {
      --bg1:#fff7e8; --bg2:#dff3ff; --panel:#ffffffcc; --ink:#2a2a2a; --accent:#ff8f5a; --good:#5dbb63;
      --white-key:#fffdf8; --white-key-border:#d6d2c8; --white-key-active:#ffd7b8; --black-key:#313131; --black-key-active:#ffb277;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;font-family:"Avenir Next","PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);overflow:hidden;touch-action:none}
    body{background:radial-gradient(circle at 20% 10%,var(--bg2),transparent 35%),radial-gradient(circle at 80% 90%,#ffe4cc,transparent 30%),linear-gradient(140deg,var(--bg1),#f1fff4);display:grid;grid-template-rows:auto 1fr;gap:10px;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
    .topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid #fff;border-radius:12px;padding:8px;backdrop-filter:blur(4px)}
    .title{font-weight:700;margin-right:auto;padding:0 6px}
    button{border:0;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;background:#f5f5f5;color:var(--ink)}
    button.active{background:var(--accent);color:#fff}
    button.guide-on{background:var(--good);color:#fff}
    select.song-select{border:0;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;color:#2a2a2a;background:#f5f5f5;max-width:210px}
    .difficulty-pill{font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px;white-space:nowrap;border:1px solid #e2e2e2}
    .diff-1{background:#fff;color:#333}.diff-2{background:#ffe3d6;color:#572700}.diff-3{background:#ffbf9f;color:#5a1f00}.diff-4{background:#ff8a67;color:#fff}.diff-5{background:#8b1e1e;color:#fff}
    .finger-hint{font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;background:#f4f4f4;color:#2a2a2a;white-space:nowrap}
    .finger-1{background:#ffd5d5}.finger-2{background:#ffe4c6}.finger-3{background:#fff6b8}.finger-4{background:#d8f4d8}.finger-5{background:#d8e7ff}
    .hint{font-size:12px;opacity:.7;padding:0 6px}
    .piano-wrap{background:#ffffffaa;border-radius:12px;border:1px solid #fff;padding:10px;overflow:hidden}
    .piano{position:relative;height:calc(100dvh - 150px);min-height:250px;max-height:520px;display:grid;grid-template-columns:repeat(14,1fr);gap:2px}
    .white{position:relative;background:var(--white-key);border:1px solid var(--white-key-border);border-radius:0 0 8px 8px;box-shadow:inset 0 -4px 0 #ece8df}
    .white.active,.white.guide{background:var(--white-key-active)}
    .white .label{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;opacity:.55}
    .black{position:absolute;width:calc((100% / 14) * .7);height:58%;background:var(--black-key);border-radius:0 0 6px 6px;z-index:5;box-shadow:inset 0 -2px 0 #161616}
    .black.active,.black.guide{background:var(--black-key-active)}
    @media (max-width:700px){.title{width:100%;margin-right:0;padding-bottom:4px}button{padding:9px 10px;font-size:14px}select.song-select{padding:9px 10px;font-size:14px;max-width:170px}.piano-wrap{padding:8px}.piano{height:calc(100dvh - 210px);min-height:220px}.white .label{font-size:10px;bottom:6px}}
    @media (orientation:landscape) and (max-height:500px){body{gap:6px;padding:max(6px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom))}.topbar{padding:6px;gap:6px;border-radius:10px}.title{width:auto;margin-right:4px;font-size:16px;padding:0 4px}button{padding:7px 10px;font-size:13px;border-radius:8px}select.song-select{padding:7px 10px;font-size:13px;border-radius:8px;max-width:150px}.hint{margin-left:auto;font-size:11px}.finger-hint{font-size:11px;padding:5px 8px}.difficulty-pill{font-size:11px;padding:5px 8px}.piano-wrap{padding:6px;border-radius:10px}.piano{height:calc(100dvh - 86px);min-height:170px;max-height:none}.black{height:54%}.white .label{font-size:9px;bottom:4px}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title">家用小鋼琴</div>
    <button id="tonePiano" class="active">鋼琴音</button>
    <button id="toneBell">鈴鐺音</button>
    <button id="guideBtn">跟彈：關閉</button>
    <button id="demoBtn">示範教學</button>
    <select id="songSelect" class="song-select" aria-label="歌曲選擇"></select>
    <div id="difficultyPill" class="difficulty-pill diff-1">難度 Lv1</div>
    <div id="fingerHint" class="finger-hint">手指：-</div>
    <div class="hint">可同時按多個鍵</div>
  </div>
  <div class="piano-wrap"><div class="piano" id="piano"></div></div>
  <script>
    const noteNames=["C","D","E","F","G","A","B"], whiteLayout=[]; for(let o=4;o<=5;o++) for(const n of noteNames) whiteLayout.push(`${n}${o}`);
    const blackMap={C:"C#",D:"D#",F:"F#",G:"G#",A:"A#"}, semitone={C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
    const songs=[
      {name:"小星星",difficulty:1,notes:["C4","C4","G4","G4","A4","A4","G4","F4","F4","E4","E4","D4","D4","C4","G4","G4","F4","F4","E4","E4","D4","G4","G4","F4","F4","E4","E4","D4","C4","C4","G4","G4","A4","A4","G4","F4","F4","E4","E4","D4","D4","C4"],fingers:[1,1,5,5,5,5,5,4,4,3,3,2,2,1,5,5,4,4,3,3,2,5,5,4,4,3,3,2,1,1,5,5,5,5,5,4,4,3,3,2,2,1]},
      {name:"生日快樂",difficulty:2,notes:["C4","C4","D4","C4","F4","E4","C4","C4","D4","C4","G4","F4","C4","C4","C5","A4","F4","E4","D4","A#4","A#4","A4","F4","G4","F4","C4","C4","D4","C4","F4","E4","C4","C4","D4","C4","G4","F4"],fingers:[1,1,2,1,4,3,1,1,2,1,5,4,1,1,5,4,3,2,1,4,4,3,1,2,1,1,1,2,1,4,3,1,1,2,1,5,4]},
      {name:"快樂頌",difficulty:3,notes:["E4","E4","F4","G4","G4","F4","E4","D4","C4","C4","D4","E4","E4","D4","D4","E4","E4","F4","G4","G4","F4","E4","D4","C4","C4","D4","E4","D4","C4","C4","D4","D4","E4","C4","D4","E4","F4","E4","C4","D4","E4","F4","E4","D4","C4","D4","G3"],fingers:[3,3,4,5,5,4,3,2,1,1,2,3,3,2,2,3,3,4,5,5,4,3,2,1,1,2,3,2,1,1,2,2,3,1,2,3,4,3,1,2,3,4,3,2,1,2,5]},
      {name:"Jingle Bells",difficulty:4,notes:["E4","E4","E4","E4","E4","E4","E4","G4","C4","D4","E4","F4","F4","F4","F4","F4","E4","E4","E4","E4","D4","D4","E4","D4","G4","E4","E4","E4","E4","E4","E4","E4","G4","C4","D4","E4","F4","F4","F4","F4","F4","E4","E4","E4","G4","G4","F4","D4","C4"],fingers:[3,3,3,3,3,3,3,5,1,2,3,4,4,4,4,4,3,3,3,3,2,2,3,2,5,3,3,3,3,3,3,3,5,1,2,3,4,4,4,4,4,3,3,3,5,5,4,2,1]},
      {name:"給愛麗絲",difficulty:5,notes:["E5","D#5","E5","D#5","E5","B4","D5","C5","A4","C4","E4","A4","B4","E4","G#4","B4","C5","E4","E5","D#5","E5","D#5","E5","B4","D5","C5","A4","C4","E4","A4","B4","E4","C5","B4","A4","B4","C5","D5","E5","G4","F5","E5","D5","F4","E5","D5","C5","E4","D5","C5","B4","E4","E5","E4","E5","D#5","E5","D#5","E5","B4","D5","C5","A4"],fingers:[3,2,3,2,3,1,3,2,1,1,2,4,5,1,2,3,4,1,3,2,3,2,3,1,3,2,1,1,2,4,5,1,4,3,2,3,4,5,1,5,4,3,1,5,4,3,1,4,3,2,1,3,1,3,1,3,2,3,2,3,1,3,2,1]}
    ];
    const audio=new(window.AudioContext||window.webkitAudioContext)(), piano=document.getElementById("piano"), tonePiano=document.getElementById("tonePiano"), toneBell=document.getElementById("toneBell"), guideBtn=document.getElementById("guideBtn"), demoBtn=document.getElementById("demoBtn"), songSelect=document.getElementById("songSelect"), difficultyPill=document.getElementById("difficultyPill"), fingerHint=document.getElementById("fingerHint");
    const activeByPointer=new Map(), keyEls=new Map(); let tone="piano", guideOn=false, guideIndex=0, songIndex=0, demoRunning=false;
    const currentSong=()=>songs[songIndex], noteToFreq=(note)=>{const m=note.match(/^([A-G]#?)(\d)$/);const midi=12*(Number(m[2])+1)+semitone[m[1]];return 440*Math.pow(2,(midi-69)/12)};
    function play(note){const t0=audio.currentTime,f=noteToFreq(note),osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=f;if(tone==="piano"){osc.type="triangle";gain.gain.setValueAtTime(0.0001,t0);gain.gain.exponentialRampToValueAtTime(0.32,t0+0.01);gain.gain.exponentialRampToValueAtTime(0.0001,t0+1.1)}else{osc.type="sine";gain.gain.setValueAtTime(0.0001,t0);gain.gain.exponentialRampToValueAtTime(0.25,t0+0.01);gain.gain.exponentialRampToValueAtTime(0.0001,t0+1.8)}osc.connect(gain).connect(audio.destination);osc.start(t0);osc.stop(t0+2)}
    function makeWhite(){whiteLayout.forEach(note=>{const k=document.createElement("div"),l=document.createElement("div");k.className="white";k.dataset.note=note;l.className="label";l.textContent=note;k.appendChild(l);piano.appendChild(k);keyEls.set(note,k)})}
    function makeBlack(){const blacks=[];whiteLayout.forEach((note,i)=>{const n=note.slice(0,-1),o=note.slice(-1);if(blackMap[n])blacks.push({note:`${blackMap[n]}${o}`,leftIndex:i})});blacks.forEach(b=>{const k=document.createElement("div");k.className="black";k.dataset.note=b.note;k.style.left=`calc((100% / 14) * ${b.leftIndex+0.65})`;piano.appendChild(k);keyEls.set(b.note,k)})}
    const hitTarget=(x,y)=>document.elementFromPoint(x,y)?.closest(".white, .black"), setActive=(el,on)=>el&&el.classList.toggle("active",on);
    function updateFingerHint(){fingerHint.className="finger-hint"; if(!guideOn){fingerHint.textContent="手指：-";return;} const f=currentSong().fingers?.[guideIndex]; if(typeof f==="undefined"){fingerHint.textContent="手指：自由彈";return;} fingerHint.classList.add(`finger-${f}`); fingerHint.textContent=`手指提示：用 ${f} 指`;}
    function refreshGuide(){keyEls.forEach(el=>el.classList.remove("guide")); if(!guideOn) return; keyEls.get(currentSong().notes[guideIndex])?.classList.add("guide"); guideBtn.classList.add("guide-on"); guideBtn.textContent=`跟彈中：${currentSong().name} 第 ${guideIndex+1} 音`; updateFingerHint();}
    function checkGuide(note){if(!guideOn)return; if(note===currentSong().notes[guideIndex]){guideIndex=(guideIndex+1)%currentSong().notes.length;refreshGuide();}}
    function showTeachingStep(index){keyEls.forEach(el=>el.classList.remove("guide")); keyEls.get(currentSong().notes[index])?.classList.add("guide"); guideIndex=index; updateFingerHint();}
    const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
    async function runDemo(){if(demoRunning)return; demoRunning=true; demoBtn.classList.add("active"); demoBtn.textContent="示範中..."; const wasGuideOn=guideOn; guideOn=true; for(let i=0;i<currentSong().notes.length;i++){showTeachingStep(i); play(currentSong().notes[i]); await wait(480);} keyEls.forEach(el=>el.classList.remove("guide")); guideOn=wasGuideOn; guideIndex=0; if(guideOn)refreshGuide(); else updateFingerHint(); demoBtn.classList.remove("active"); demoBtn.textContent="示範教學"; demoRunning=false;}
    function updateDifficultyPill(){const lv=Math.max(1,Math.min(5,currentSong().difficulty||1)); difficultyPill.className=`difficulty-pill diff-${lv}`; difficultyPill.textContent=`難度 Lv${lv}`;}
    function buildSongSelect(){songSelect.innerHTML=""; songs.forEach((song,idx)=>{const opt=document.createElement("option"); opt.value=String(idx); opt.textContent=`${song.name} (Lv${song.difficulty||1})`; songSelect.appendChild(opt)}); songSelect.value=String(songIndex); updateDifficultyPill();}
    function press(pid,el){if(!el)return; const prev=activeByPointer.get(pid); if(prev===el)return; if(prev)setActive(prev,false); activeByPointer.set(pid,el); setActive(el,true); play(el.dataset.note); checkGuide(el.dataset.note);}
    function release(pid){const prev=activeByPointer.get(pid); if(prev)setActive(prev,false); activeByPointer.delete(pid);}
    piano.addEventListener("pointerdown",async e=>{if(audio.state!=="running")await audio.resume(); press(e.pointerId,hitTarget(e.clientX,e.clientY))});
    window.addEventListener("pointermove",e=>{if(activeByPointer.has(e.pointerId))press(e.pointerId,hitTarget(e.clientX,e.clientY))});
    ["pointerup","pointercancel","pointerleave"].forEach(evt=>window.addEventListener(evt,e=>release(e.pointerId)));
    tonePiano.onclick=()=>{tone="piano";tonePiano.classList.add("active");toneBell.classList.remove("active")};
    toneBell.onclick=()=>{tone="bell";toneBell.classList.add("active");tonePiano.classList.remove("active")};
    guideBtn.onclick=()=>{guideOn=!guideOn;guideIndex=0;if(!guideOn){keyEls.forEach(el=>el.classList.remove("guide"));guideBtn.classList.remove("guide-on");guideBtn.textContent="跟彈：關閉";updateFingerHint();return;}refreshGuide();};
    demoBtn.onclick=()=>runDemo();
    songSelect.onchange=()=>{if(demoRunning)return; songIndex=Number(songSelect.value)||0; guideIndex=0; updateDifficultyPill(); if(guideOn)refreshGuide(); else updateFingerHint();};
    makeWhite(); makeBlack(); buildSongSelect(); updateFingerHint();
  </script>
</body>
</html>
